<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
#s16-root { position: absolute; inset: 0; overflow: hidden; background: #0b0b0d; color: #f5f5f7;
  font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
#s16-root .stage { position: absolute; inset: 0; }
#s16-root .ghost { position: absolute; width: 1300px; height: 1300px; right: -420px; top: -110px; opacity: 0.05; }
#s16-root .k { position: absolute; left: 130px; top: 112px; display: flex; align-items: center; gap: 16px;
  font: 400 22px/1 'JetBrains Mono', monospace; letter-spacing: 0.16em; text-transform: uppercase; color: #8e8e93; }
#s16-root .k.lc { text-transform: none; letter-spacing: 0.04em; }
#s16-root .h { font-weight: 900; letter-spacing: -0.045em; line-height: 1.02; }
#s16-root .xl { font-size: 134px; }
#s16-root .lg { font-size: 88px; }
#s16-root .md { font-size: 69px; }
#s16-root .b { font-size: 30px; line-height: 1.4; color: #8e8e93; font-weight: 400; }
#s16-root .b strong { color: #f5f5f7; font-weight: 700; }
#s16-root .w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: 0.08em; margin-bottom: -0.08em; }
#s16-root .wi { display: inline-block; }
#s16-root .chip { display: inline-block; font: 400 20px/1 'JetBrains Mono', monospace; letter-spacing: 0.08em;
  text-transform: uppercase; border: 1px solid #3a3a3e; color: #f5f5f7; border-radius: 99px; padding: 12px 20px; }
#s16-root .ipad { position: absolute; background: #000; border-radius: 44px; padding: 17px; border: 3px solid #3a3a3e;
  box-shadow: 0 40px 96px rgba(0,0,0,0.6); }
#s16-root .ipad img { display: block; width: 100%; border-radius: 27px; }
#s16-root .win { position: absolute; background: #fff; border-radius: 27px; overflow: hidden; box-shadow: 0 40px 96px rgba(0,0,0,0.6); }
#s16-root .win img { display: block; width: 100%; }
#s16-root .card { position: absolute; background: #1c1c1e; border-radius: 31px; }

#s16-root .co { position: absolute; display: flex; align-items: center; gap: 14px; opacity: 0;
  font: 400 22px/1 'JetBrains Mono', monospace; letter-spacing: 0.14em; text-transform: uppercase; color: #f5f5f7;
  border: 1px solid #3a3a3e; border-radius: 99px; padding: 14px 22px; background: #0b0b0d; }
#s16-root .co i { width: 12px; height: 12px; border-radius: 50%; background: #30d158; display: block; }
#s16-root .ipad .scr { overflow: hidden; border-radius: 27px; }
#s16-root .ipad .scr img { border-radius: 0; }
</style>
      <div id="s16-root" data-composition-id="s16" data-width="1920" data-height="1080">
  <div class="stage" data-layout-allow-overflow>
  <div class="h xl" id="s16-a" style="position:absolute;left:0;right:0;top:300px;text-align:center">Done for them.</div>
  <div class="h xl" id="s16-b" style="position:absolute;left:0;right:0;top:440px;text-align:center">Not to them.</div>
  <div class="b" id="s16-cap" style="position:absolute;left:0;right:0;top:640px;text-align:center;font-size:36px">Retail mobility, managed in every store.</div>
  <div id="s16-lock" style="position:absolute;left:0;right:0;top:770px;display:flex;justify-content:center;align-items:center;gap:30px">
    <svg viewBox="0 0 36 36" style="width:52px;height:52px"><circle id="s16-ring" cx="18" cy="18" r="15" fill="none" stroke="#30d158" stroke-width="3" stroke-dasharray="94.25" stroke-dashoffset="94.25"/></svg>
    <img id="s16-logo" src="assets/deck/ienterprise-logo.png" alt="" style="width:330px"></div>
  </div>
</div>
      <script>
(() => {
  const R = document.getElementById('s16-root');
  const $ = (s) => R.querySelector(s);
  const $$ = (s) => Array.from(R.querySelectorAll(s));
  // Wrap each word of .split elements in a mask so it can rise into view.
  $$('.split').forEach((el) => {
    el.innerHTML = el.textContent.trim().split(/\s+/)
      .map((w) => '<span class="w" data-layout-allow-overflow><span class="wi">' + w + '</span></span>').join(' ');
  });
  // Per-character spans for typed kickers.
  $$('.type').forEach((el) => {
    el.innerHTML = Array.from(el.textContent).map((c) => '<span class="c">' + (c === ' ' ? '&nbsp;' : c) + '</span>').join('');
  });
  const TL = gsap.timeline({ paused: true });
  const D = 39.0, K = 3.9000, DK = Math.min(1.8, Math.sqrt(K));
  // Scene code below is authored on the 2:31 cut's clock. In the long cut, positions stretch by K
  // and moves by DK (or by K when a tween is marked _k, for slow continuous camera moves).
  const sv = (v) => {
    const o = Object.assign({}, v);
    if (o.duration != null) o.duration *= o._k ? K : DK;
    if (typeof o.stagger === 'number') o.stagger *= DK;
    delete o._k;
    return o;
  };
  const tl = {
    fromTo: (t, a, b, p) => TL.fromTo(t, a, sv(b), p * K),
    to: (t, b, p) => TL.to(t, sv(b), p * K),
  };
  const rise = (sel, at, stagger = 0.06, dur = 0.7) =>
    tl.fromTo(R.querySelectorAll(sel + ' .wi'), { yPercent: 110 }, { yPercent: 0, duration: dur, ease: 'power3.out', stagger }, at);
  const fadeUp = (sel, at, y = 28, dur = 0.6) =>
    tl.fromTo(sel, { opacity: 0, y }, { opacity: 1, y: 0, duration: dur, ease: 'power3.out' }, at);
  const typeIn = (sel, at, per = 0.035) =>
    tl.fromTo(R.querySelectorAll(sel + ' .c'), { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: per }, at);
  // Ambient: the ghost status ring turns slowly for the whole scene.
  if ($('.ghost')) TL.fromTo('#s16-root .ghost', { rotation: -8 }, { rotation: 14, duration: D, ease: 'none' }, 0);
  // Ambient: a slow push on the whole stage so long holds never sit dead.
  TL.set('#s16-root .stage', { scale: 1 }, 0);
  TL.to('#s16-root .stage', { scale: 1.03, duration: D, ease: 'none' }, 0);
  // Seams: push enters from the right; exits leave to the left or fade through black.
  

  tl.fromTo('#s16-a', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, ease: 'power3.out' }, 0.4);
  tl.fromTo('#s16-b', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.8, ease: 'power3.out' }, 1.4);
  fadeUp('#s16-cap', 3.6, 20, 0.9);
  tl.fromTo('#s16-logo', { opacity: 0 }, { opacity: 1, duration: 1.0, ease: 'power1.out' }, 4.4);
  tl.to('#s16-ring', { strokeDashoffset: 0, duration: 1.2, ease: 'expo.out' }, 4.8);
  tl.to('#s16-root .stage', { opacity: 0, duration: 1.0, ease: 'power1.in' }, 9.0);

  
  window.__timelines['s16'] = TL;
})();
      </script>
    </template>
  </body>
</html>
