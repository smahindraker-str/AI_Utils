<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
#s01-root { position: absolute; inset: 0; overflow: hidden; background: #0b0b0d; color: #f5f5f7;
  font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
#s01-root .stage { position: absolute; inset: 0; }
#s01-root .ghost { position: absolute; width: 1300px; height: 1300px; right: -420px; top: -110px; opacity: 0.05; }
#s01-root .k { position: absolute; left: 130px; top: 112px; display: flex; align-items: center; gap: 16px;
  font: 400 22px/1 'JetBrains Mono', monospace; letter-spacing: 0.16em; text-transform: uppercase; color: #8e8e93; }
#s01-root .k.lc { text-transform: none; letter-spacing: 0.04em; }
#s01-root .h { font-weight: 900; letter-spacing: -0.045em; line-height: 1.02; }
#s01-root .xl { font-size: 134px; }
#s01-root .lg { font-size: 88px; }
#s01-root .md { font-size: 69px; }
#s01-root .b { font-size: 30px; line-height: 1.4; color: #8e8e93; font-weight: 400; }
#s01-root .b strong { color: #f5f5f7; font-weight: 700; }
#s01-root .w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: 0.08em; margin-bottom: -0.08em; }
#s01-root .wi { display: inline-block; }
#s01-root .chip { display: inline-block; font: 400 20px/1 'JetBrains Mono', monospace; letter-spacing: 0.08em;
  text-transform: uppercase; border: 1px solid #3a3a3e; color: #f5f5f7; border-radius: 99px; padding: 12px 20px; }
#s01-root .ipad { position: absolute; background: #000; border-radius: 44px; padding: 17px; border: 3px solid #3a3a3e;
  box-shadow: 0 40px 96px rgba(0,0,0,0.6); }
#s01-root .ipad img { display: block; width: 100%; border-radius: 27px; }
#s01-root .win { position: absolute; background: #fff; border-radius: 27px; overflow: hidden; box-shadow: 0 40px 96px rgba(0,0,0,0.6); }
#s01-root .win img { display: block; width: 100%; }
#s01-root .card { position: absolute; background: #1c1c1e; border-radius: 31px; }
</style>
      <div id="s01-root" data-composition-id="s01" data-width="1920" data-height="1080">
  <div class="stage">
  <div class="k"><span class="type">Retail runs on iOS</span></div>
  <div class="h xl split" id="s01-title" style="position:absolute;left:130px;top:360px;width:1400px">Modernizing Retail Mobility.</div>
  <div class="b" id="s01-name" style="position:absolute;left:134px;top:680px;font-size:44px">Matin, Lululemon.</div>
  <img id="s01-logo" src="assets/deck/ienterprise-logo.png" alt="" style="position:absolute;right:130px;bottom:110px;width:300px">
  </div>
</div>
      <script>
(() => {
  const R = document.getElementById('s01-root');
  const $ = (s) => R.querySelector(s);
  const $$ = (s) => Array.from(R.querySelectorAll(s));
  // Wrap each word of .split elements in a mask so it can rise into view.
  $$('.split').forEach((el) => {
    el.innerHTML = el.textContent.trim().split(/\s+/)
      .map((w) => '<span class="w" data-layout-allow-overflow><span class="wi">' + w + '</span></span>').join(' ');
  });
  // Per-character spans for typed kickers.
  $$('.type').forEach((el) => {
    el.innerHTML = Array.from(el.textContent).map((c) => '<span class="c">' + (c === ' ' ? '&nbsp;' : c) + '</span>').join('');
  });
  const tl = gsap.timeline({ paused: true });
  const D = 7.4;
  const rise = (sel, at, stagger = 0.06, dur = 0.7) =>
    tl.fromTo(R.querySelectorAll(sel + ' .wi'), { yPercent: 110 }, { yPercent: 0, duration: dur, ease: 'power3.out', stagger }, at);
  const fadeUp = (sel, at, y = 28, dur = 0.6) =>
    tl.fromTo(sel, { opacity: 0, y }, { opacity: 1, y: 0, duration: dur, ease: 'power3.out' }, at);
  const typeIn = (sel, at, per = 0.035) =>
    tl.fromTo(R.querySelectorAll(sel + ' .c'), { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: per }, at);
  // Ambient: the ghost status ring turns slowly for the whole scene.
  if ($('.ghost')) tl.fromTo('#s01-root .ghost', { rotation: -8 }, { rotation: 14, duration: D, ease: 'none' }, 0);
  // Seams: push enters from the right; exits leave to the left or fade through black.
  

  typeIn('.k', 0.2, 0.05);
  rise('#s01-title', 1.3, 0.12, 0.9);
  fadeUp('#s01-name', 2.8);
  tl.fromTo('#s01-logo', { opacity: 0 }, { opacity: 0.9, duration: 1.0, ease: 'power1.out' }, 3.6);

  tl.to('#s01-root .stage', { x: -160, opacity: 0, duration: 0.45, ease: 'power2.in' }, D - 0.45);
  window.__timelines['s01'] = tl;
})();
      </script>
    </template>
  </body>
</html>
