#s02-root .k.lc { text-transform: none; letter-spacing: 0.04em; }
#s02-root .h { font-weight: 900; letter-spacing: -0.045em; line-height: 1.02; }
#s02-root .xl { font-size: 134px; }
#s02-root .lg { font-size: 88px; }
#s02-root .md { font-size: 69px; }

  box-shadow: 0 40px 96px rgba(0,0,0,0.6); }
#s02-root .ipad img { display: block; width: 100%; border-radius: 27px; }
#s02-root .win { position: absolute; background: #fff; border-radius: 27px; overflow: hidden; box-shadow: 0 40px 96px rgba(0,0,0,0.6); }

      <div id="s02-root" data-composition-id="s02" data-width="1920" data-height="1080">
  <div class="stage" data-layout-allow-overflow>
  <div class="k "><svg class="ring k-ring" viewBox="0 0 36 36" style="width:30px;height:30px"><circle cx="18" cy="18" r="15" fill="none" stroke="#48484c" stroke-width="3" stroke-dasharray="40 100"/></svg><span class="k-t">The starting point</span></div>
  <div class="h md split" id="s02-l1" style="position:absolute;left:130px;top:330px;width:1600px">We replaced an aging MDM platform.</div>
  <div class="h xl split" id="s02-l2" style="position:absolute;left:130px;top:470px;width:1500px">What changed was much bigger.</div>

</div>
      <script>
(() => {
  const R = document.getElementById('s02-root');
  const $ = (s) => R.querySelector(s);
  const $$ = (s) => Array.from(R.querySelectorAll(s));
  // Wrap each word of .split elements in a mask so it can rise into view.
  $$('.split').forEach((el) => {
    el.innerHTML = el.textContent.trim().split(/\s+/)
      .map((w) => '<span class="w" data-layout-allow-overflow><span class="wi">' + w + '</span></span>').join(' ');
  });
  // Per-character spans for typed kickers.
  $$('.type').forEach((el) => {
    el.innerHTML = Array.from(el.textContent).map((c) => '<span class="c">' + (c === ' ' ? '&nbsp;' : c) + '</span>').join('');
  });
  const TL = gsap.timeline({ paused: true });
  const D = 21.0, K = 3.0000, DK = Math.min(1.8, Math.sqrt(K));
  // Scene code below is authored on the 2:31 cut's clock. In the long cut, positions stretch by K
  // and moves by DK (or by K when a tween is marked _k, for slow continuous camera moves).
  const sv = (v) => {
    const o = Object.assign({}, v);
    if (o.duration != null) o.duration *= o._k ? K : DK;
    if (typeof o.stagger === 'number') o.stagger *= DK;
    delete o._k;
    return o;
  };
  const tl = {
    fromTo: (t, a, b, p) => TL.fromTo(t, a, sv(b), p * K),
    to: (t, b, p) => TL.to(t, sv(b), p * K),
  };
  const rise = (sel, at, stagger = 0.06, dur = 0.7) =>
    tl.fromTo(R.querySelectorAll(sel + ' .wi'), { yPercent: 110 }, { yPercent: 0, duration: dur, ease: 'power3.out', stagger }, at);
  const fadeUp = (sel, at, y = 28, dur = 0.6) =>
    tl.fromTo(sel, { opacity: 0, y }, { opacity: 1, y: 0, duration: dur, ease: 'power3.out' }, at);
  const typeIn = (sel, at, per = 0.035) =>
    tl.fromTo(R.querySelectorAll(sel + ' .c'), { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: per }, at);
  // Ambient: the ghost status ring turns slowly for the whole scene.
  if ($('.ghost')) TL.fromTo('#s02-root .ghost', { rotation: -8 }, { rotation: 14, duration: D, ease: 'none' }, 0);
  // Ambient: a slow push on the whole stage so long holds never sit dead.
  TL.set('#s02-root .stage', { scale: 1 }, 0);
  TL.to('#s02-root .stage', { scale: 1.03, duration: D, ease: 'none' }, 0);
  // Seams: push enters from the right; exits leave to the left or fade through black.
  TL.fromTo('#s02-root .stage', { x: 160, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: 'power3.out' }, 0);

  fadeUp('#s02-root .k', 0.3, 12);
  rise('#s02-l1', 0.6, 0.07);
  tl.to('#s02-l1', { color: '#48484c', duration: 0.6, ease: 'power1.inOut' }, 3.3);
  rise('#s02-l2', 3.5, 0.09, 0.8);
  tl.fromTo('#s02-l2', { scale: 0.97, transformOrigin: '0% 50%' }, { scale: 1, duration: 1.6, ease: 'power2.out' }, 3.5);

  TL.to('#s02-root .stage', { x: -160, opacity: 0, duration: 0.45, ease: 'power2.in' }, D - 0.45);
  window.__timelines['s02'] = TL;
})();
      </script>
