<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
#s15-root { position: absolute; inset: 0; overflow: hidden; background: #0b0b0d; color: #f5f5f7;
  font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
#s15-root .stage { position: absolute; inset: 0; }
#s15-root .ghost { position: absolute; width: 1300px; height: 1300px; right: -420px; top: -110px; opacity: 0.05; }
#s15-root .k { position: absolute; left: 130px; top: 112px; display: flex; align-items: center; gap: 16px;
  font: 400 22px/1 'JetBrains Mono', monospace; letter-spacing: 0.16em; text-transform: uppercase; color: #8e8e93; }
#s15-root .k.lc { text-transform: none; letter-spacing: 0.04em; }
#s15-root .h { font-weight: 900; letter-spacing: -0.045em; line-height: 1.02; }
#s15-root .xl { font-size: 134px; }
#s15-root .lg { font-size: 88px; }
#s15-root .md { font-size: 69px; }
#s15-root .b { font-size: 30px; line-height: 1.4; color: #8e8e93; font-weight: 400; }
#s15-root .b strong { color: #f5f5f7; font-weight: 700; }
#s15-root .w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: 0.08em; margin-bottom: -0.08em; }
#s15-root .wi { display: inline-block; }
#s15-root .chip { display: inline-block; font: 400 20px/1 'JetBrains Mono', monospace; letter-spacing: 0.08em;
  text-transform: uppercase; border: 1px solid #3a3a3e; color: #f5f5f7; border-radius: 99px; padding: 12px 20px; }
#s15-root .ipad { position: absolute; background: #000; border-radius: 44px; padding: 17px; border: 3px solid #3a3a3e;
  box-shadow: 0 40px 96px rgba(0,0,0,0.6); }
#s15-root .ipad img { display: block; width: 100%; border-radius: 27px; }
#s15-root .win { position: absolute; background: #fff; border-radius: 27px; overflow: hidden; box-shadow: 0 40px 96px rgba(0,0,0,0.6); }
#s15-root .win img { display: block; width: 100%; }
#s15-root .card { position: absolute; background: #1c1c1e; border-radius: 31px; }

#s15-root .rn { font: 400 26px/1 'JetBrains Mono', monospace; color: #48484c; letter-spacing: 0.08em; }
#s15-root .lesson { position: absolute; left: 0; top: 0; width: 100%; opacity: 0; }
#s15-root .lt { font-weight: 900; font-size: 84px; line-height: 1.04; letter-spacing: -0.04em; }
#s15-root .ls { font-size: 44px; color: #8e8e93; margin-top: 30px; }
</style>
      <div id="s15-root" data-composition-id="s15" data-width="1920" data-height="1080">
  <div class="stage">
  <div class="k "><span class="k-t">The takeaways</span></div>
  <div class="h md split" id="s15-title" style="position:absolute;left:130px;top:160px;width:1600px">For other retailers.</div>
  <div id="s15-rail" style="position:absolute;left:134px;top:380px;display:grid;gap:22px"><div class="rn" id="s15-n0">01</div><div class="rn" id="s15-n1">02</div><div class="rn" id="s15-n2">03</div><div class="rn" id="s15-n3">04</div><div class="rn" id="s15-n4">05</div><div class="rn" id="s15-n5">06</div><div class="rn" id="s15-n6">07</div></div>
  <div style="position:absolute;left:400px;top:400px;width:1390px;height:520px"><div class="lesson" id="s15-l0"><div class="lt">Be clear about the problem before choosing the tools.</div></div><div class="lesson" id="s15-l1"><div class="lt">Choose partners who understand the platform and the operating environment.</div></div><div class="lesson" id="s15-l2"><div class="lt">Align priorities with internal teams early.</div><div class="ls">Shared support is not shared urgency.</div></div><div class="lesson" id="s15-l3"><div class="lt">Use the pilot to find friction, and be ready to change the plan.</div></div><div class="lesson" id="s15-l4"><div class="lt">Treat readiness as ongoing work, not the final step.</div></div><div class="lesson" id="s15-l5"><div class="lt">Do not shift technology work to educators.</div></div><div class="lesson" id="s15-l6"><div class="lt">Expect visibility to expose what the business case missed.</div></div></div>
  </div>
</div>
      <script>
(() => {
  const R = document.getElementById('s15-root');
  const $ = (s) => R.querySelector(s);
  const $$ = (s) => Array.from(R.querySelectorAll(s));
  // Wrap each word of .split elements in a mask so it can rise into view.
  $$('.split').forEach((el) => {
    el.innerHTML = el.textContent.trim().split(/\s+/)
      .map((w) => '<span class="w" data-layout-allow-overflow><span class="wi">' + w + '</span></span>').join(' ');
  });
  // Per-character spans for typed kickers.
  $$('.type').forEach((el) => {
    el.innerHTML = Array.from(el.textContent).map((c) => '<span class="c">' + (c === ' ' ? '&nbsp;' : c) + '</span>').join('');
  });
  const tl = gsap.timeline({ paused: true });
  const D = 19.1;
  const rise = (sel, at, stagger = 0.06, dur = 0.7) =>
    tl.fromTo(R.querySelectorAll(sel + ' .wi'), { yPercent: 110 }, { yPercent: 0, duration: dur, ease: 'power3.out', stagger }, at);
  const fadeUp = (sel, at, y = 28, dur = 0.6) =>
    tl.fromTo(sel, { opacity: 0, y }, { opacity: 1, y: 0, duration: dur, ease: 'power3.out' }, at);
  const typeIn = (sel, at, per = 0.035) =>
    tl.fromTo(R.querySelectorAll(sel + ' .c'), { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: per }, at);
  // Ambient: the ghost status ring turns slowly for the whole scene.
  if ($('.ghost')) tl.fromTo('#s15-root .ghost', { rotation: -8 }, { rotation: 14, duration: D, ease: 'none' }, 0);
  // Seams: push enters from the right; exits leave to the left or fade through black.
  tl.fromTo('#s15-root .stage', { x: 160, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: 'power3.out' }, 0);

  fadeUp('#s15-root .k', 0.1, 12);
  rise('#s15-title', 0.3, 0.07);
  tl.fromTo('#s15-rail .rn', { opacity: 0 }, { opacity: 1, duration: 0.4, stagger: 0.05 }, 0.7);
  const step = 2.5, first = 1.4;
  for (let i = 0; i < 7; i++) {
    const t = first + i * step;
    tl.fromTo('#s15-l' + i, { opacity: 0, y: 36 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, t);
    tl.to('#s15-n' + i, { color: '#f5f5f7', duration: 0.25 }, t);
    if (i < 6) {
      tl.to('#s15-l' + i, { opacity: 0, y: -30, duration: 0.3, ease: 'power2.in' }, t + step - 0.3);
      tl.to('#s15-n' + i, { color: '#8e8e93', duration: 0.25 }, t + step - 0.1);
    }
  }

  tl.to('#s15-root .stage', { opacity: 0, duration: 0.4, ease: 'power1.in' }, D - 0.4);
  window.__timelines['s15'] = tl;
})();
      </script>
    </template>
  </body>
</html>
